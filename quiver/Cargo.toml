[workspace]
resolver = "2"
exclude = ["arrow-adbc-rs"]
members = [
    "quiver-schema",
    "quiver-codegen",
    "quiver-error",
    "quiver-cli",
    "quiver-e2e",
    "quiver-driver-core",
    "quiver-driver-sqlite",
    "quiver-driver-postgres",
    "quiver-driver-mysql",
    "quiver-query",
    "quiver-migrate",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Shuozeli/quiver"
homepage = "https://github.com/Shuozeli/quiver"

[workspace.dependencies]
# Internal
quiver-schema = { path = "quiver-schema" }
quiver-codegen = { path = "quiver-codegen" }
quiver-error = { path = "quiver-error" }
quiver-driver-core = { path = "quiver-driver-core" }
quiver-driver-sqlite = { path = "quiver-driver-sqlite" }
quiver-driver-postgres = { path = "quiver-driver-postgres" }
quiver-driver-mysql = { path = "quiver-driver-mysql" }
quiver-query = { path = "quiver-query" }
quiver-migrate = { path = "quiver-migrate" }

# Encoding
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Arrow / ADBC (our own clean-room implementation, local submodule)
adbc = { path = "arrow-adbc-rs/adbc" }
adbc-sqlite = { path = "arrow-adbc-rs/adbc-sqlite" }
adbc-postgres = { path = "arrow-adbc-rs/adbc-postgres" }
adbc-mysql = { path = "arrow-adbc-rs/adbc-mysql" }
arrow-array = "58"
arrow-buffer = "58"
arrow-schema = "58"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
futures-core = "0.3"

# Database (used directly by quiver-e2e for schema DDL tests)
rusqlite = { version = "0.35", features = ["bundled"] }

# Codegen backends (our own compilers)
flatc-rs-compiler = { git = "https://github.com/Shuozeli/flatbuffers-rs.git" }
flatc-rs-codegen = { git = "https://github.com/Shuozeli/flatbuffers-rs.git" }
flatc-rs-schema = { git = "https://github.com/Shuozeli/flatbuffers-rs.git" }
protoc-rs-analyzer = { git = "https://github.com/Shuozeli/protobuf-rs.git" }
protoc-rs-codegen = { git = "https://github.com/Shuozeli/protobuf-rs.git" }
protoc-rs-schema = { git = "https://github.com/Shuozeli/protobuf-rs.git" }
